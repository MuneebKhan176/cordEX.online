<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications — cordEX</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#000000; --surface:#0a0a0a; --surface2:#111111; --surface3:#161616;
      --border:#1a1a1a; --border2:#222222; --text:#ffffff; --text-2:#888888; --text-3:#444444;
      --blue:#3b82f6; --blue-dim:rgba(59,130,246,0.12);
      --green:#22c55e; --green-dim:rgba(34,197,94,0.12);
      --red:#ef4444; --red-dim:rgba(239,68,68,0.12);
      --purple:#a855f7; --purple-dim:rgba(168,85,247,0.12);
      --ease: cubic-bezier(.16,1,.3,1);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(900px 500px at 15% -10%, rgba(59,130,246,0.07), transparent 60%), var(--bg);
      color: var(--text); min-height: 100vh;
    }
    .topnav {
      height: 60px; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
      position: sticky; top: 0; z-index: 200; backdrop-filter: blur(12px);
    }
    .topnav-logo {
      font-size: 1.15rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(90deg,#fff 0%,#93c5fd 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none; display: flex; align-items: center; gap: 7px;
    }
    .topnav-logo-dot { width:7px; height:7px; background: var(--blue); border-radius:50%; -webkit-text-fill-color: initial; }
    .topnav-right { margin-left: auto; display:flex; align-items:center; gap:10px; }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 7px;
      font-size: .82rem; font-weight: 600; text-decoration: none;
      border: 1px solid var(--border2); color: var(--text-2); background: transparent; cursor: pointer; transition: all .18s;
    }
    .nav-pill:hover { color:#fff; border-color:#444; background: var(--surface2); }

    .page { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }
    .page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
    .page-title {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -.6px;
      background: linear-gradient(90deg, #fff 30%, #a9c4f5 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .mark-all-btn {
      padding: 7px 14px; border-radius: 999px; font-size: .78rem; font-weight: 700;
      background: var(--surface2); border: 1px solid var(--border2); color: var(--text-2); cursor:pointer;
    }
    .mark-all-btn:hover { color:#fff; border-color:#444; }

    .notif-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 16px; border-radius: 12px; margin-bottom: 8px;
      background: var(--surface2); border: 1px solid var(--border); cursor: pointer;
      transition: border-color .15s, transform .15s var(--ease), background .15s;
      position: relative;
    }
    .notif-item:hover { border-color: rgba(59,130,246,.35); transform: translateX(2px); }
    .notif-item.unread { background: linear-gradient(180deg, rgba(59,130,246,0.08), var(--surface2) 60%); }
    .notif-item.unread::before {
      content:''; position:absolute; left:6px; top:50%; transform:translateY(-50%);
      width:6px; height:6px; border-radius:50%; background: var(--blue);
    }
    .notif-icon-wrap {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size: 1.05rem;
    }
    .notif-icon-wrap.like    { background: var(--red-dim);   color: var(--red); }
    .notif-icon-wrap.comment { background: var(--blue-dim);  color: var(--blue); }
    .notif-icon-wrap.reply   { background: var(--blue-dim);  color: var(--blue); }
    .notif-icon-wrap.follow  { background: var(--green-dim); color: var(--green); }
    .notif-icon-wrap.mention { background: var(--purple-dim);color: var(--purple); }
    .notif-icon-wrap svg { width: 19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.9; }
    .notif-icon-wrap.like svg { fill: currentColor; }

    .notif-avatar {
      width: 28px; height: 28px; border-radius: 50%; overflow:hidden; flex-shrink:0;
      background: linear-gradient(135deg,#3b82f6,#1d4ed8);
      display:flex; align-items:center; justify-content:center; font-size:.62rem; font-weight:700; color:#fff;
      position: absolute; margin-left: 26px; margin-top: 26px; border: 2px solid var(--surface2);
    }
    .notif-avatar img { width:100%; height:100%; object-fit:cover; }

    .notif-body { flex: 1; min-width: 0; padding-left: 4px; }
    .notif-text { font-size: .88rem; color: var(--text); line-height:1.5; }
    .notif-text b { font-weight:700; }
    .notif-time { font-size: .74rem; color: var(--text-3); margin-top: 3px; }

    .empty-state {
      background: var(--surface); border: 1px dashed var(--border2); border-radius: 14px;
      padding: 50px 20px; text-align:center; color: var(--text-3); font-size:.9rem; margin-top: 20px;
    }
    .loading-state { text-align:center; padding:40px; color:var(--text-3); font-size:.85rem; }
    .spinner-inline {
      display:inline-block; width:14px; height:14px; border:2px solid var(--border2); border-top-color: var(--blue);
      border-radius:50%; animation: spin .7s linear infinite; vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .load-more-wrap { text-align:center; margin-top: 10px; }
    .load-more-btn {
      padding: 9px 22px; border-radius: 8px; font-size: .82rem; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border2); color: var(--text-2); cursor: pointer;
    }
    .load-more-btn:hover { color:#fff; border-color:#444; }
    .load-more-btn:disabled { opacity:.5; cursor:not-allowed; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:99px; }
  </style>
</head>
<body>

<header class="topnav">
  <a href="/crypto-square" class="topnav-logo"><span class="topnav-logo-dot"></span>cordEX</a>
  <div class="topnav-right">
    <a href="/crypto-square" class="nav-pill">← Back to Crypto Square</a>
  </div>
</header>

<div class="page">
  <div class="page-head">
    <div class="page-title">Notifications</div>
    <button type="button" class="mark-all-btn" id="markAllBtn" onclick="markAllRead()">Mark all as read</button>
  </div>

  <div id="notifContainer">
    <div class="loading-state"><span class="spinner-inline"></span>Loading notifications…</div>
  </div>

  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load more</button>
  </div>
</div>

<script>
let page = 0;
let hasMore = true;
let fetching = false;
let allNotifs = [];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

const ICONS = {
  like:    '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6z"/></svg>',
  comment: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.3 8.3 0 0 1-3.8-.9L3 21l1.9-5.7a8.3 8.3 0 0 1-.9-3.8A8.4 8.4 0 0 1 12.5 3h.1A8.4 8.4 0 0 1 21 11.4v.1z"/></svg>',
  reply:   '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.3 8.3 0 0 1-3.8-.9L3 21l1.9-5.7a8.3 8.3 0 0 1-.9-3.8A8.4 8.4 0 0 1 12.5 3h.1A8.4 8.4 0 0 1 21 11.4v.1z"/></svg>',
  follow:  '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>',
  mention: '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-5.5 8.28"/></svg>',
};

const VERB = {
  like: 'liked your post',
  comment: 'commented on your post',
  reply: 'replied to your comment',
  follow: 'started following you',
  mention: 'mentioned you in a post',
};

function formatTime(dateInput) {
  const d = new Date(dateInput);
  const diffMs = Date.now() - d.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function notifItemHtml(n) {
  const actorName = n.actor?.displayName || n.actorUsername;
  const initials = (actorName || '?').slice(0, 2).toUpperCase();
  const avatarHtml = n.actor?.avatarUrl
    ? `<img src="${n.actor.avatarUrl}" alt="avatar"/>`
    : initials;

  return `
    <div class="notif-item${n.isRead ? '' : ' unread'}" data-id="${n._id}" data-type="${n.type}" data-target-id="${n.targetId || ''}" data-actor="${escapeHtml(n.actorUsername)}">
      <div class="notif-icon-wrap ${n.type}">${ICONS[n.type] || ICONS.mention}</div>
      <div class="notif-avatar">${avatarHtml}</div>
      <div class="notif-body">
        <div class="notif-text"><b>${escapeHtml(actorName)}</b> ${VERB[n.type] || 'interacted with your account'}</div>
        <div class="notif-time">${formatTime(n.createdAt)}</div>
      </div>
    </div>`;
}

async function loadNotifications() {
  if (fetching || !hasMore) return;
  fetching = true;
  const container = document.getElementById('notifContainer');
  if (page === 0) container.innerHTML = `<div class="loading-state"><span class="spinner-inline"></span>Loading notifications…</div>`;

  try {
    const r = await fetch(`/api/notifications?page=${page + 1}`);
    const d = await r.json();
    if (!d.success) {
      if (r.status === 401) { window.location.href = '/login'; return; }
      container.innerHTML = `<div class="empty-state">${escapeHtml(d.message || 'Failed to load notifications.')}</div>`;
      return;
    }

    allNotifs = allNotifs.concat(d.data.notifications || []);
    page = d.data.page;
    hasMore = !!d.data.hasMore;

    render();
  } catch (e) {
    console.error('loadNotifications error:', e);
    if (!allNotifs.length) container.innerHTML = `<div class="empty-state">Network error while loading notifications.</div>`;
  } finally {
    fetching = false;
  }
}

function render() {
  const container = document.getElementById('notifContainer');
  const loadMoreWrap = document.getElementById('loadMoreWrap');

  if (!allNotifs.length) {
    container.innerHTML = `<div class="empty-state">No notifications yet. Likes, comments, and new followers will show up here.</div>`;
    loadMoreWrap.style.display = 'none';
    return;
  }

  container.innerHTML = allNotifs.map(notifItemHtml).join('');
  loadMoreWrap.style.display = hasMore ? 'block' : 'none';
}

function loadMore() {
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  loadNotifications().finally(() => {
    btn.disabled = false;
    btn.textContent = 'Load more';
  });
}

document.getElementById('notifContainer').addEventListener('click', async (e) => {
  const item = e.target.closest('.notif-item');
  if (!item) return;

  const id = item.dataset.id;
  const type = item.dataset.type;
  const targetId = item.dataset.targetId;
  const actor = item.dataset.actor;

  if (item.classList.contains('unread')) {
    item.classList.remove('unread');
    fetch(`/api/notifications/${id}/read`, { method: 'POST' }).catch(() => {});
  }

  if ((type === 'like' || type === 'comment' || type === 'reply' || type === 'mention') && targetId) {
    window.location.href = `/post/${targetId}`;
  } else if (type === 'follow') {
    window.location.href = `/square-profile/${encodeURIComponent(actor)}`;
  }
});

async function markAllRead() {
  try {
    await fetch('/api/notifications/read-all', { method: 'POST' });
    document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
  } catch (e) {
    console.error('markAllRead error:', e);
  }
}

/* Live push — new notifications while this page is open get prepended */
async function connectSocialSocket() {
  try {
    const r = await fetch('/api/ws-token');
    const d = await r.json();
    if (!d.success) return;

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${proto}://${location.host}/ws/social?token=${encodeURIComponent(d.data.token)}`;
    const ws = new WebSocket(url);

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.event === 'notification') {
          allNotifs.unshift({ ...msg.data, actor: { displayName: msg.data.actorUsername, avatarUrl: '' } });
          render();
        }
      } catch (e) { /* ignore */ }
    };
  } catch (e) { /* ignore */ }
}

document.addEventListener('DOMContentLoaded', () => {
  loadNotifications();
  connectSocialSocket();
});
</script>
</body>
</html>
