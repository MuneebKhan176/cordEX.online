services:
  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    image: cordex-mysql:8.4
    container_name: cordex-mysql
    restart: unless-stopped
    environment:
      # DB_USERNAME / DB_PASSWORD are the credentials used by the app.
      # The supplied configuration uses DB_USERNAME=root, so the container
      # initializes the root account with DB_PASSWORD. 
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - cordex_mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-schema-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: cordex-node:latest
    container_name: cordex-mysql-schema-init
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: ["node", "Databases/MySQL/initDB.js"]
    depends_on:
      mysql:
        condition: service_healthy

  mysql-ai-permissions:
    build:
      context: .
      dockerfile: Dockerfile
    image: cordex-node:latest
    container_name: cordex-mysql-ai-permissions
    restart: "no"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command: ["node", "Databases/MySQL/initAIPermissions.js"]
    depends_on:
      mysql-schema-init:
        condition: service_completed_successfully

  mongodb:
    image: mongo:8.0
    container_name: cordex-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:?MONGO_DB_NAME is required}
      MONGO_DB_NAME: ${MONGO_DB_NAME:?MONGO_DB_NAME is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
        - cordex_mongodb_data:/data/db
        - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb-schema-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: cordex-node:latest
    container_name: cordex-mongodb-schema-init
    restart: "no"
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
      MONGO_DB_NAME: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in .env}
    command: ["node", "Databases/MongoDB/initMongoDB.js"]
    depends_on:
      mongodb:
        condition: service_healthy

  spot-engine:
    build:
      context: .
      dockerfile: Spot_Engine/Dockerfile
    container_name: cordex-spot-engine
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9000:9000"

  futures-engine:
    build:
      context: .
      dockerfile: Futures_Engine/Dockerfile
    container_name: cordex-futures-engine
    restart: unless-stopped
    expose:
      - "9001"
    ports:
      - "127.0.0.1:9001:9001"

  ai-analytics:
    build:
      context: .
      dockerfile: ai_analytics/Dockerfile
    container_name: cordex-ai-analytics
    restart: unless-stopped
    init: true
    environment:
      AI_DB_HOST: mysql
      AI_DB_PORT: 3306
      AI_DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      AI_DB_USER: ${AI_DB_USER:?Set AI_DB_USER in .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env}
      AI_INTERNAL_SERVICE_SECRET: ${AI_INTERNAL_SERVICE_SECRET:?Set AI_INTERNAL_SERVICE_SECRET in .env}
    expose:
      - "8001"
    depends_on:
      mysql-ai-permissions:
        condition: service_completed_successfully

  node-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cordex-node:latest
    container_name: cordex-node
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 7070
      DB_HOST: mysql
      DB_PORT: 3306
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
      TRADE_ENGINE_HOST: spot-engine
      TRADE_ENGINE_PORT: 9000
      FUTURES_ENGINE_HOST: futures-engine
      FUTURES_ENGINE_PORT: 9001
      AI_ANALYTICS_SERVICE_URL: http://ai-analytics:8001
    ports:
      - "7070:7070"
    volumes:
      - cordex_uploads:/app/uploads
    depends_on:
      mysql-ai-permissions:
        condition: service_completed_successfully
      mongodb-schema-init:
        condition: service_completed_successfully
      spot-engine:
        condition: service_started
      futures-engine:
        condition: service_started
      ai-analytics:
        condition: service_started

volumes:
  cordex_uploads:
  cordex_mysql_data:
  cordex_mongodb_data:
