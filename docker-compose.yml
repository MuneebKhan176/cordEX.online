services:
  spot-engine:
    build:
      context: .
      dockerfile: Spot_Engine/Dockerfile
    container_name: cordex-spot-engine
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9000:9000"

  futures-engine:
    build:
      context: .
      dockerfile: Futures_Engine/Dockerfile
    container_name: cordex-futures-engine
    restart: unless-stopped
    expose:
      - "9001"
    ports:
      - "127.0.0.1:9001:9001"

  ai-analytics:
    build:
      context: .
      dockerfile: ai_analytics/Dockerfile
    container_name: cordex-ai-analytics
    restart: unless-stopped
    init: true
    environment:
      AI_DB_HOST: ${AI_DB_HOST:?Set AI_DB_HOST in .env}
      AI_DB_PORT: ${AI_DB_PORT:-3306}
      AI_DB_NAME: ${AI_DB_NAME:?Set AI_DB_NAME in .env}
      AI_DB_USER: ${AI_DB_USER:?Set AI_DB_USER in .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env}
      AI_INTERNAL_SERVICE_SECRET: ${AI_INTERNAL_SERVICE_SECRET:?Set AI_INTERNAL_SERVICE_SECRET in .env}
    expose:
      - "8001"

  node-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cordex-node
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 7070
      TRADE_ENGINE_HOST: spot-engine
      TRADE_ENGINE_PORT: 9000
      FUTURES_ENGINE_HOST: futures-engine
      FUTURES_ENGINE_PORT: 9001
      AI_ANALYTICS_SERVICE_URL: http://ai-analytics:8001
    ports:
      - "7070:7070"
    volumes:
      - cordex_uploads:/app/uploads
    depends_on:
      - spot-engine
      - futures-engine
      - ai-analytics

volumes:
  cordex_uploads:
